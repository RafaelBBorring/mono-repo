project_id = "maestro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5012"
additional_redirect_urls = ["http://localhost:5012/**", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.miro-oauth]
verify_jwt = false

[functions.miro-import]
verify_jwt = true

[functions.ingestion-worker]
verify_jwt = true

[functions.maestro-chat]
verify_jwt = true

[functions.provider-config]
verify_jwt = true

[functions.miro-sdk-capture]
verify_jwt = true

[functions.manual-source]
verify_jwt = true
