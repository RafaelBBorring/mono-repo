services:
  maestro-web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5012}
        VITE_ENABLE_DEMO: ${VITE_ENABLE_DEMO:-true}
    ports:
      - "5012:80"
    restart: unless-stopped
