server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA – serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 1100M;
    }

    # Static media served directly by the backend
    location /thumbs/    { proxy_pass http://backend:8000; }
    location /features/  { proxy_pass http://backend:8000; }
    location /videos/    { proxy_pass http://backend:8000; proxy_read_timeout 300s; }
}
