services:
  morpheus-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BILLING_REQUIRED: ${NEXT_PUBLIC_BILLING_REQUIRED:-true}
        NEXT_PUBLIC_STRIPE_CHECKOUT_ENABLED: ${NEXT_PUBLIC_STRIPE_CHECKOUT_ENABLED:-true}
        NEXT_PUBLIC_STRIPE_PAYMENT_LINK_MONTHLY: ${NEXT_PUBLIC_STRIPE_PAYMENT_LINK_MONTHLY:-}
        NEXT_PUBLIC_STRIPE_PAYMENT_LINK_YEARLY: ${NEXT_PUBLIC_STRIPE_PAYMENT_LINK_YEARLY:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    container_name: morpheus-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
