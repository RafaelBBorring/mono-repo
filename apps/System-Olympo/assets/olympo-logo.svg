<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#C2A34D" stroke-width="2" opacity="0.3"/>
  
  <!-- Sun rays -->
  <g stroke="#C2A34D" stroke-width="3" stroke-linecap="round">
    <!-- Top -->
    <line x1="200" y1="40" x2="200" y2="80"/>
    <!-- Top-right -->
    <line x1="313" y1="87" x2="279" y2="121"/>
    <!-- Right -->
    <line x1="360" y1="200" x2="320" y2="200"/>
    <!-- Bottom-right -->
    <line x1="313" y1="313" x2="279" y2="279"/>
    <!-- Bottom -->
    <line x1="200" y1="360" x2="200" y2="320"/>
    <!-- Bottom-left -->
    <line x1="87" y1="313" x2="121" y2="279"/>
    <!-- Left -->
    <line x1="40" y1="200" x2="80" y2="200"/>
    <!-- Top-left -->
    <line x1="87" y1="87" x2="121" y2="121"/>
    
    <!-- Diagonal rays -->
    <line x1="257" y1="57" x2="277" y2="97"/>
    <line x1="343" y1="143" x2="303" y2="163"/>
    <line x1="343" y1="257" x2="303" y2="237"/>
    <line x1="257" y1="343" x2="277" y2="303"/>
    <line x1="143" y1="343" x2="123" y2="303"/>
    <line x1="57" y1="257" x2="97" y2="237"/>
    <line x1="57" y1="143" x2="97" y2="163"/>
    <line x1="143" y1="57" x2="123" y2="97"/>
  </g>
  
  <!-- Central circle -->
  <circle cx="200" cy="200" r="60" fill="none" stroke="#C2A34D" stroke-width="2"/>
  <circle cx="200" cy="200" r="55" fill="none" stroke="#C2A34D" stroke-width="1" opacity="0.5"/>
  
  <!-- Text -->
  <text x="200" y="280" font-family="Cinzel, serif" font-size="28" font-weight="700" text-anchor="middle" fill="#C2A34D" letter-spacing="2">
    OLYMPO
  </text>
  <text x="200" y="310" font-family="Cinzel, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#C2A34D" letter-spacing="1" opacity="0.8">
    STUDIO
  </text>
</svg>
