      const raceBlock = data.raca
        ? `<div class="dp-section-title">Raca</div>
           <div style="font-size:.86rem;color:var(--text1);padding:.3rem .1rem .6rem;font-family:'Cinzel',serif;user-select:text;-webkit-user-select:text">${escapeHtml(data.raca)}</div>`
        : '';

      const summaryText = [
        `${sheet.nome || 'Ficha'} | Nv ${sheet.nivel} | NA ${sheet.na}`,
        `PV: ${curHp}/${stats.vida ?? '-'}`,
        `CA: ${stats.ca ?? '-'} | Arm: ${stats.arm ?? '-'}`,
        `Ataque: d20+${stats.ba ?? '-'} | Defesa: d20+${stats.bd ?? '-'}`,
        `Dano: ${(stats.dano ?? '-')}${stats.danoExtra || ''} | Reacoes: ${stats.reac ?? '-'}`,
        data.raca ? `Raca: ${data.raca}` : ''
      ].filter(Boolean).join('\n');

      const allAbilitiesText = abs.length
        ? abs.map((ab, index) => {
            const statsLine = ab.stats?.length ? ` | ${ab.stats.join(' | ')}` : '';
            return `${index + 1}. ${ab.name} [${ab.type || 'habilidade'}]\n${ab.description || ''}${statsLine}`;
          }).join('\n\n')
        : 'Sem habilidades registradas.';

      document.getElementById('dp-pane-ficha').innerHTML = `
        <div style="padding:.6rem .75rem" class="dp-ai-copyable">
          <div style="display:flex;gap:.4rem;justify-content:flex-end;margin-bottom:.55rem;flex-wrap:wrap">
            <button class="quick-copy-btn" onclick='copyTextBlock(decodeURIComponent("${encodeURIComponent(summaryText)}"), "Resumo da ficha copiado!")'>
              <i class="bi bi-clipboard"></i> Copiar resumo
            </button>
            <button class="quick-copy-btn" onclick='copyTextBlock(decodeURIComponent("${encodeURIComponent(allAbilitiesText)}"), "Habilidades copiadas!")'>
              <i class="bi bi-journal-text"></i> Copiar habilidades
            </button>
          </div>
          ${raceBlock}
          ${attrHtml}
          <div class="dp-section-title">Habilidades</div>
          ${abHtml || '<div style="font-size:.8rem;color:var(--text2);padding:.5rem 0">Sem habilidades registradas.</div>'}
        </div>`;
    };

    callAiAnalysis = async function(sheet) {
      const data = sheet.data || {};
      const stats = data.stats || {};
      const abs = data.abilities || [];
      const attrs = data.attrs || [];
      const profile = (typeof PROFILE_NAMES !== 'undefined' ? PROFILE_NAMES[sheet.profile] : null) || sheet.profile;
      const raca = data.raca ? `Raca: ${data.raca}` : '';

      const abList = abs.map((ab, i) =>
        `${i + 1}. [${(ab.type || '').toUpperCase()}] ${ab.name}: ${ab.description}${ab.stats?.length ? ' | ' + ab.stats.join(', ') : ''}`
      ).join('\n');

      const attrStr = ATTR_NAMES_PANEL.map((n, i) => `${n}:${attrs[i] ?? '?'}`).join(' ');

      const systemPrompt = `Voce e um analista tatico de RPG especializado em suporte de combate para mestres.
Retorne apenas JSON valido.
Priorize praticidade em mesa, rolagens prontas e clareza imediata.`;

      const userPrompt = `Analise este personagem e gere um guia de combate rapido para uso em sessao.

PERSONAGEM: ${sheet.nome}
Perfil: ${profile} | Nivel: ${sheet.nivel} | NA: ${sheet.na}
${raca}
Stats: PV:${stats.vida} CA:${stats.ca} Arm:${stats.arm} Ataque:+${stats.ba} Defesa:+${stats.bd} Dano:${stats.dano}${stats.danoExtra || ''} Reacoes:${stats.reac}
Atributos: ${attrStr}

HABILIDADES:
${abList}

Retorne SOMENTE este JSON:
{
  "ataques_rapidos": [
    {
      "nome": "Investida Voraz",
      "rolagem": "Ataque: d20+X",
      "dano": "Dano: XdY + dano base",
      "gatilho": "Quando usar",
      "execucao": "Descricao curta da acao",
      "extras": ["Bonus garantido: +2 no ataque"],
      "texto_copiavel": "Investida Voraz | Ataque: ... | Dano: ..."
    }
  ],
  "combos": [
    {
      "tier": "basico",
      "nome": "Nome do Combo",
      "descricao": "Resumo do combo.",
      "passos": ["Habilidade A", "Habilidade B"],
      "efeito": "Resultado esperado.",
      "rolagens": ["Ataque: d20+X", "Dano: XdY + dano base"],
      "texto_copiavel": "Combo | Ataque ... | Dano ...",
      "dica": "Quando usar."
    }
  ],
  "resumo_tatico": "Resumo curto.",
  "ponto_forte": "Ponto forte.",
  "ponto_fraco": "Ponto fraco."
}`;

      const rawText = await callAiJson([
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt }
      ]);

      const parsed = await parseAiJsonResponse(
        rawText,
        ['combos', 'resumo_tatico', 'ponto_forte', 'ponto_fraco'],
        '{"ataques_rapidos":[],"combos":[],"resumo_tatico":"","ponto_forte":"","ponto_fraco":""}'
      );

      if (!Array.isArray(parsed.ataques_rapidos)) parsed.ataques_rapidos = [];
      if (!Array.isArray(parsed.combos)) parsed.combos = [];
      return parsed;
    };

    renderAiContent = function(data) {
      document.getElementById('dp-ai-loading').style.display = 'none';
      document.getElementById('dp-ai-placeholder').style.display = 'none';
      document.getElementById('dp-ai-error').style.display = 'none';

      const tierLabel = { basico: 'Basico', avancado: 'Avancado', ultimate: 'Ultimate' };
      const tierClass = { basico: 'basic', avancado: 'advanced', ultimate: 'ultimate' };

      const quickHtml = (data.ataques_rapidos || []).map((atk, idx) => {
        const textToCopy = atk.texto_copiavel || [atk.nome, atk.rolagem, atk.dano, atk.execucao, ...(atk.extras || [])].filter(Boolean).join('\n');
        const extrasHtml = (atk.extras || []).map(extra => `
          <div class="quick-metric">
            <div class="quick-metric-label">Extra</div>
            <div class="quick-metric-value">${escapeHtml(extra)}</div>
          </div>`).join('');

        return `
          <div class="quick-card dp-ai-copyable">
            <div class="quick-header">
              <div style="min-width:0;flex:1">
                <div class="quick-name">${escapeHtml(atk.nome || `Ataque ${idx + 1}`)}</div>
                ${atk.rolagem ? `<div class="quick-roll"><i class="bi bi-dice-5"></i>${escapeHtml(atk.rolagem)}</div>` : ''}
              </div>
              <button class="quick-copy-btn" onclick='copyTextBlock(decodeURIComponent("${encodeURIComponent(textToCopy)}"), "Ataque rapido copiado!")'>
                <i class="bi bi-clipboard"></i> Copiar
              </button>
            </div>
            ${atk.execucao ? `<div class="quick-desc">${escapeHtml(atk.execucao)}</div>` : ''}
            <div class="quick-metrics">
              ${atk.dano ? `<div class="quick-metric"><div class="quick-metric-label">Dano</div><div class="quick-metric-value">${escapeHtml(atk.dano)}</div></div>` : ''}
              ${atk.gatilho ? `<div class="quick-metric"><div class="quick-metric-label">Quando usar</div><div class="quick-metric-value">${escapeHtml(atk.gatilho)}</div></div>` : ''}
              ${extrasHtml}
            </div>
            ${textToCopy ? `<div class="ai-copy-block">${escapeHtml(textToCopy)}</div>` : ''}
          </div>`;
      }).join('');

      const combosHtml = (data.combos || []).map(c => {
        const comboCopy = c.texto_copiavel || [c.nome, ...(c.rolagens || []), c.efeito, c.dica].filter(Boolean).join('\n');
        return `
          <div class="combo-card ${tierClass[c.tier] || 'basic'} dp-ai-copyable">
            <div class="combo-tier ${tierClass[c.tier] || 'basic'}">${tierLabel[c.tier] || c.tier}</div>
            <div class="combo-name">${escapeHtml(c.nome || 'Combo')}</div>
            <div class="combo-desc">${escapeHtml(c.descricao || '')}</div>
            ${c.passos?.length ? `<div class="combo-steps">${c.passos.map(p => `<span class="combo-step">${escapeHtml(p)}</span>`).join('')}</div>` : ''}
            ${c.rolagens?.length ? `<div class="ai-copy-block" style="margin-bottom:.45rem">${escapeHtml(c.rolagens.join('\n'))}</div>` : ''}
            <div class="combo-effect"><i class="bi bi-arrow-right-short"></i> ${escapeHtml(c.efeito || '')}</div>
            ${c.dica ? `<div style="font-size:.76rem;color:#a69b88;margin-top:.35rem;font-style:italic;line-height:1.55"><i class="bi bi-lightbulb"></i> ${escapeHtml(c.dica)}</div>` : ''}
            <div class="combo-copy-row">
              <button class="combo-copy-btn" onclick='copyTextBlock(decodeURIComponent("${encodeURIComponent(comboCopy)}"), "Combo copiado!")'>
                <i class="bi bi-clipboard"></i> Copiar
              </button>
            </div>
          </div>`;
      }).join('');

      const resumoHtml = data.resumo_tatico ? `
        <div class="dp-section-title">Estilo de Jogo</div>
        <div class="dp-ai-copyable" style="font-size:.84rem;color:#d0c5b4;line-height:1.7;margin-bottom:.6rem;user-select:text;-webkit-user-select:text">${escapeHtml(data.resumo_tatico)}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.75rem">
          <div style="background:rgba(110,200,120,.07);border:1px solid rgba(110,200,120,.2);border-radius:6px;padding:.4rem .5rem">
            <div style="font-size:.56rem;color:#6dc87a;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.15rem">Ponto Forte</div>
            <div class="dp-ai-copyable" style="font-size:.8rem;color:var(--text1);line-height:1.55">${escapeHtml(data.ponto_forte || '-')}</div>
          </div>
          <div style="background:rgba(224,82,82,.07);border:1px solid rgba(224,82,82,.2);border-radius:6px;padding:.4rem .5rem">
            <div style="font-size:.56rem;color:var(--red);letter-spacing:.07em;text-transform:uppercase;margin-bottom:.15rem">Ponto Fraco</div>
            <div class="dp-ai-copyable" style="font-size:.8rem;color:var(--text1);line-height:1.55">${escapeHtml(data.ponto_fraco || '-')}</div>
          </div>
        </div>` : '';

      const contentEl = document.getElementById('dp-ai-content');
      contentEl.innerHTML = `
        ${resumoHtml}
        <div class="dp-section-title">Ataques Rapidos</div>
        ${quickHtml || '<div style="font-size:.82rem;color:var(--text2);padding:.35rem 0 .7rem">A IA nao retornou ataques rapidos desta vez.</div>'}
        <div class="dp-section-title">Combos e Taticas</div>
        ${combosHtml}
        <div class="dp-ai-note"><i class="bi bi-robot"></i> Gerado por IA - Pode conter imprecisoes</div>
        <div style="padding:.25rem 0 .5rem;text-align:center">
          <button onclick="_aiCache[getCard(_detailCardId)?.sheetId]=null;resetAiPane();"
            style="font-size:.65rem;color:var(--text2);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:'Rajdhani',sans-serif">
            Regenerar analise
          </button>
        </div>`;
      contentEl.style.display = 'block';

      const btn = document.getElementById('dp-ai-btn');
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-stars"></i> Analisar com IA'; }
    };

    function _updateBoardModePill() {
      const pill = document.getElementById('board-mode-pill');
      if (!pill) return;
      if (DB.isLocal()) {
        pill.innerHTML = '<i class="bi bi-hdd-fill"></i> Local';
        pill.style.borderColor = 'rgba(110,200,110,.4)';
        pill.style.color = '#6dc87a';
      } else {
        pill.innerHTML = '<i class="bi bi-cloud-fill"></i> Supabase';
        pill.style.borderColor = 'rgba(100,150,255,.35)';
        pill.style.color = '#7baaf7';
      }
    }

    async function toggleBoardMode() {
      DB.setMode(DB.isLocal() ? 'supabase' : 'local');
      _updateBoardModePill();
      currentUser = await DB.initAuth();
      if (!currentUser) { window.location.href = '/login.html'; return; }
      showToast(DB.isLocal() ? '🖥️ Banco local ativado' : '☁️ Supabase ativado');
      await loadBoard();
    }

    initAuth().then(() => { _updateBoardModePill(); resetView(); });
  </script>
</body>
</html>
