<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Codex Arcanum — Quadro de Sessão</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:   #c9a84c; --gold2: #e8c96a;
      --dark:   #06070e; --dark2: #0b0d18; --dark3: #101320;
      --border: rgba(201,168,76,.18);
      --text1:  #ddd0b8; --text2: #64605a;
      --red: #e05252; --green: #34d399; --blue: #60a5fa; --purple: #a78bfa;
    }
    body { background: #060710; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: var(--text1); user-select: none; }

    /* ── Topbar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(9,9,16,.96); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: .75rem;
      padding: .5rem 1.25rem; height: 48px;
    }
    .tb-brand { font-family: 'Cinzel', serif; font-size: .82rem; letter-spacing: .14em;
      background: linear-gradient(135deg,var(--gold),var(--gold2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; white-space:nowrap; }
    .tb-sep { width: 1px; height: 20px; background: var(--border); }
    .tb-title { font-size: .82rem; color: var(--text2); letter-spacing: .06em; white-space:nowrap; }
    .tb-spacer { flex: 1; }
    .tb-btn {
      padding: .3rem .75rem; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text2); font-family: 'Rajdhani',sans-serif;
      font-size: .8rem; font-weight: 600; cursor: pointer;
      transition: all .18s; white-space: nowrap;
      display: flex; align-items: center; gap: .35rem;
    }
    .tb-btn:hover { color: var(--gold); border-color: rgba(201,168,76,.4); background: rgba(201,168,76,.06); }
    .tb-btn.primary { color: var(--gold); border-color: rgba(201,168,76,.35); }
    .tb-btn.danger  { color: var(--red);  border-color: rgba(224,82,82,.3); }
    .tb-btn.danger:hover { background: rgba(224,82,82,.08); }

    /* ── Quadro infinito ── */
    #board {
      position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
      overflow: hidden; cursor: grab;
      background-color: #090910;
      background-image:
        radial-gradient(circle, rgba(201,168,76,.12) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    #board.panning { cursor: grabbing; }
    #board-canvas {
      position: absolute; top: 0; left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* ── Mini-card no quadro ── */
    .board-card {
      position: absolute;
      width: 260px;
      background: linear-gradient(145deg, rgba(19,19,31,.97), rgba(13,13,22,.98));
      border: 1px solid rgba(201,168,76,.25);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,.6);
      cursor: default;
      transition: box-shadow .15s;
    }
    .board-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,.8), 0 0 0 1px rgba(201,168,76,.3); }

    /* Header do card */
    .bc-header {
      display: flex; align-items: center; gap: .6rem;
      padding: .65rem .75rem .5rem;
      border-bottom: 1px solid rgba(201,168,76,.12);
      cursor: grab;
    }
    .bc-header:active { cursor: grabbing; }
    .bc-avatar {
      width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0;
      background: rgba(201,168,76,.1); border: 1px solid rgba(201,168,76,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: var(--gold); overflow: hidden;
    }
    .bc-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .bc-info { flex: 1; min-width: 0; }
    .bc-name {
      font-family: 'Cinzel', serif; font-size: .78rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bc-tags { display: flex; gap: .25rem; margin-top: .2rem; flex-wrap: wrap; }
    .bc-tag {
      font-size: .58rem; font-weight: 700; letter-spacing: .05em;
      padding: .1rem .35rem; border-radius: 3px;
      background: rgba(201,168,76,.12); color: var(--gold);
      border: 1px solid rgba(201,168,76,.2);
    }
    .bc-tag.profile { background: rgba(80,60,160,.2); color: #a090e0; border-color: rgba(80,60,160,.3); }
    .bc-close {
      background: none; border: none; color: rgba(224,82,82,.4);
      cursor: pointer; padding: .2rem; font-size: .85rem; flex-shrink: 0;
    }
    .bc-close:hover { color: var(--red); }
    .bc-open {
      background: none; border: none; color: rgba(201,168,76,.55);
      cursor: pointer; padding: .2rem; font-size: .85rem; flex-shrink: 0;
      transition: color .15s;
    }
    .bc-open:hover { color: var(--gold2); }

    /* Stats principais editáveis */
    .bc-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 1px; background: rgba(201,168,76,.08);
      border-bottom: 1px solid rgba(201,168,76,.1);
    }
    .bc-stat {
      background: rgba(13,13,22,.98);
      padding: .45rem .3rem; text-align: center;
    }
    .bc-stat-val {
      font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700;
      color: var(--text1); line-height: 1;
      outline: none; min-width: 1ch; display: inline-block;
      border-bottom: 1px solid transparent;
      transition: border-color .15s;
    }
    .bc-stat-val:focus { border-bottom-color: var(--gold); color: var(--gold2); }
    .bc-stat-val.hp { color: var(--green); }
    .bc-stat-val.hp:focus { color: var(--green); }
    .bc-stat-lbl { font-size: .6rem; color: var(--text2); letter-spacing: .07em; margin-top: .2rem; text-transform: uppercase; }

    /* PV com barra de vida */
    .bc-hp-wrap { grid-column: 1/-1; background: rgba(13,13,22,.98); padding: .5rem .75rem; }
    .bc-hp-row  { display: flex; align-items: center; justify-content: space-between; margin-bottom: .3rem; }
    .bc-hp-label { font-size: .65rem; color: var(--text2); letter-spacing: .07em; text-transform: uppercase; }
    .bc-hp-val {
      font-family: 'Cinzel', serif; font-size: .95rem; font-weight: 700;
      color: var(--green); outline: none;
      border-bottom: 1px dashed transparent;
    }
    .bc-hp-val:focus { border-bottom-color: var(--green); }
    .bc-hp-max { font-size: .7rem; color: var(--text2); }
    .bc-hp-bar { height: 5px; background: rgba(255,255,255,.07); border-radius: 3px; overflow: hidden; }
    .bc-hp-fill { height: 100%; border-radius: 3px; transition: width .3s, background-color .3s; }

    /* Seção de habilidades colapsável */
    .bc-section-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: .4rem .75rem; cursor: pointer;
      border-top: 1px solid rgba(201,168,76,.1);
      font-size: .7rem; color: var(--text2); letter-spacing: .07em;
      transition: color .15s;
    }
    .bc-section-toggle:hover { color: var(--gold); }
    .bc-abilities { padding: 0 .6rem .5rem; display: none; }
    .bc-abilities.open { display: block; }
    .bc-ab {
      padding: .35rem .4rem; border-radius: 5px; margin-bottom: .25rem;
      border-left: 2px solid rgba(201,168,76,.3);
      font-size: .72rem; color: var(--text2);
    }
    .bc-ab-name { color: var(--text3, #c8b88a); font-weight: 600; font-size: .75rem; margin-bottom: .1rem; }
    .bc-ab.passiva  { border-left-color: rgba(110,180,110,.5); }
    .bc-ab.ultimate { border-left-color: rgba(180,100,220,.5); }

    /* Texto selecionável nas habilidades e stats do board */
    .bc-ab, .bc-ab-name, .bc-ab-desc, .bc-ab-stats,
    .bc-stat-val, .bc-hp-max {
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }
    .bc-ab { cursor: default; }
    .bc-ab-name { cursor: text; }

    /* Quick actions */
    .bc-actions {
      display: flex; gap: .3rem; padding: .45rem .6rem;
      border-top: 1px solid rgba(201,168,76,.08);
    }
    .bc-act {
      flex: 1; padding: .3rem .2rem; border-radius: 5px;
      border: 1px solid rgba(201,168,76,.15); background: transparent;
      color: var(--text2); font-family: 'Rajdhani',sans-serif;
      font-size: .68rem; font-weight: 600; cursor: pointer;
      transition: all .15s; text-align: center;
    }
    .bc-act:hover { color: var(--gold); border-color: rgba(201,168,76,.4); background: rgba(201,168,76,.07); }
    .bc-act.red:hover { color: var(--red); border-color: rgba(224,82,82,.35); background: rgba(224,82,82,.06); }
    .bc-act.active { color: var(--gold); border-color: rgba(201,168,76,.5); background: rgba(201,168,76,.1); }
    .bc-act.active.dmg { color: var(--red); border-color: rgba(224,82,82,.5); background: rgba(224,82,82,.08); }

    /* ── Inline HP panel ── */
    .bc-hp-panel {
      display: none; flex-direction: column; gap: 0;
      border-top: 1px solid rgba(201,168,76,.08);
      overflow: hidden;
      animation: slideDown .18s ease;
    }
    @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .bc-hp-panel.open { display: flex; }
    .bc-hp-panel-inner {
      display: flex; align-items: center; gap: .4rem;
      padding: .45rem .6rem;
    }
    .bc-hp-panel.dmg-mode .bc-hp-panel-inner { background: rgba(224,82,82,.04); }
    .bc-hp-panel.heal-mode .bc-hp-panel-inner { background: rgba(52,211,153,.04); }
    .bc-hp-panel-label {
      font-family: 'Rajdhani',sans-serif; font-size: .68rem; font-weight:700;
      letter-spacing: .06em; white-space:nowrap;
    }
    .bc-hp-panel.dmg-mode  .bc-hp-panel-label { color: var(--red); }
    .bc-hp-panel.heal-mode .bc-hp-panel-label { color: #34d399; }
    .bc-hp-input {
      flex: 1; min-width: 0;
      background: rgba(6,7,14,.8); border: 1px solid rgba(201,168,76,.2);
      border-radius: 5px; color: #ddd0b8;
      font-family: 'Rajdhani',sans-serif; font-size: .9rem; font-weight:700;
      padding: .22rem .5rem; text-align: center; outline: none;
      transition: border-color .15s;
    }
    .bc-hp-panel.dmg-mode  .bc-hp-input:focus { border-color: rgba(224,82,82,.5); }
    .bc-hp-panel.heal-mode .bc-hp-input:focus { border-color: rgba(52,211,153,.45); }
    .bc-hp-apply {
      padding: .22rem .7rem; border-radius: 5px; border: none;
      font-family: 'Rajdhani',sans-serif; font-size: .75rem; font-weight:700;
      cursor: pointer; transition: all .15s; white-space:nowrap;
    }
    .bc-hp-panel.dmg-mode  .bc-hp-apply { background: rgba(224,82,82,.75); color:#fff; }
    .bc-hp-panel.dmg-mode  .bc-hp-apply:hover { background: rgba(224,82,82,.95); }
    .bc-hp-panel.heal-mode .bc-hp-apply { background: rgba(52,211,153,.7); color:#06070e; }
    .bc-hp-panel.heal-mode .bc-hp-apply:hover { background: rgba(52,211,153,.9); }
    .bc-hp-cancel {
      background: none; border: none; color: #64605a; cursor:pointer;
      font-size:.85rem; padding:.1rem .2rem; transition: color .15s;
      line-height:1;
    }
    .bc-hp-cancel:hover { color: #9e8e6a; }

    /* ── Sidebar de fichas ── */
    .sidebar {
      position: fixed; top: 48px; right: 0; bottom: 0;
      width: 220px; z-index: 100;
      background: rgba(13,13,20,.97); backdrop-filter: blur(8px);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform .25s;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: .85rem 1rem .65rem;
      border-bottom: 1px solid var(--border);
      font-family: 'Cinzel', serif; font-size: .82rem;
      letter-spacing: .09em; color: var(--gold);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1rem; }
    .sidebar-list { flex: 1; overflow-y: auto; padding: .5rem; }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: rgba(201,168,76,.2); border-radius: 2px; }
    .sl-item {
      display: flex; align-items: center; gap: .6rem;
      padding: .55rem .6rem; border-radius: 8px;
      border: 1px solid transparent; cursor: pointer;
      margin-bottom: .3rem; transition: all .15s;
    }
    .sl-item:hover { border-color: rgba(201,168,76,.3); background: rgba(201,168,76,.06); }
    .sl-avatar {
      width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
      background: rgba(201,168,76,.1); border: 1px solid rgba(201,168,76,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem; color: var(--gold); overflow: hidden;
    }
    .sl-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .sl-info { min-width: 0; }
    .sl-name { font-size: .78rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sl-meta { font-size: .65rem; color: var(--text2); }
    .sl-empty { padding: 1rem; text-align: center; color: var(--text2); font-size: .82rem; font-style: italic; }
    .sidebar-filter {
      width: 100%;
      background: rgba(6,7,14,.85);
      border: 1px solid rgba(201,168,76,.18);
      border-radius: 8px;
      color: #ddd0b8;
      padding: .42rem .65rem;
      font-size: .76rem;
      box-sizing: border-box;
      outline: none;
      font-family: 'Rajdhani',sans-serif;
      letter-spacing: .03em;
    }
    .sidebar-filter:focus { border-color: rgba(201,168,76,.4); }

    /* ── Zoom indicator ── */
    .zoom-indicator {
      position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
      background: rgba(13,13,20,.9); border: 1px solid var(--border);
      border-radius: 8px; padding: .3rem .75rem;
      font-size: .75rem; color: var(--text2); pointer-events: none;
      opacity: 0; transition: opacity .3s;
    }
    .zoom-indicator.visible { opacity: 1; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: rgba(13,13,20,.95); border: 1px solid rgba(109,204,128,.3);
      border-radius: 9px; padding: .65rem 1rem;
      font-size: .85rem; color: var(--green);
      display: flex; align-items: center; gap: .5rem;
      opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; }

    /* ── Painel de Detalhe (esquerda) ── */
    .detail-panel {
      position: fixed; top: 48px; left: 0; bottom: 0;
      width: 360px; z-index: 150;
      background: rgba(9,9,18,.98); backdrop-filter: blur(14px);
      border-right: 1px solid rgba(201,168,76,.2);
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      box-shadow: 4px 0 32px rgba(0,0,0,.7);
    }
    .detail-panel.open { transform: translateX(0); }

    .dp-header {
      display: flex; align-items: center; gap: .6rem;
      padding: .75rem 1rem;
      border-bottom: 1px solid rgba(201,168,76,.15);
      background: rgba(13,13,22,.95);
      flex-shrink: 0;
    }
    .dp-avatar {
      width: 48px; height: 48px; border-radius: 8px; flex-shrink: 0;
      background: rgba(201,168,76,.1); border: 1px solid rgba(201,168,76,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: var(--gold); overflow: hidden;
    }
    .dp-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .dp-header-info { flex: 1; min-width: 0; }
    .dp-name {
      font-family: 'Cinzel', serif; font-size: .95rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      background: linear-gradient(135deg,var(--gold),var(--gold2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .dp-sub { font-size: .7rem; color: var(--text2); margin-top: .15rem; }
    .dp-close {
      background: none; border: none; color: var(--text2); cursor: pointer;
      font-size: 1.1rem; padding: .25rem; flex-shrink: 0;
      transition: color .15s;
    }
    .dp-close:hover { color: var(--red); }

    /* Stats no painel */
    .dp-stats-row {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 1px; background: rgba(201,168,76,.08);
      border-bottom: 1px solid rgba(201,168,76,.1); flex-shrink: 0;
    }
    .dp-stat {
      background: rgba(11,13,24,.98);
      padding: .5rem .3rem; text-align: center;
    }
    .dp-stat-val {
      font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 700;
      color: var(--text1); display: block;
    }
    .dp-stat-val.hp { color: var(--green); }
    .dp-stat-lbl { font-size: .58rem; color: var(--text2); letter-spacing: .07em; text-transform: uppercase; margin-top: .15rem; }

    /* Tabs */
    .dp-tabs {
      display: flex; border-bottom: 1px solid rgba(201,168,76,.12);
      flex-shrink: 0;
    }
    .dp-tab {
      flex: 1; padding: .5rem .5rem; text-align: center;
      font-size: .7rem; font-weight: 700; letter-spacing: .06em;
      color: var(--text2); cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .18s;
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .dp-tab:hover { color: var(--gold); }
    .dp-tab.active { color: var(--gold); border-bottom-color: var(--gold); background: rgba(201,168,76,.04); }

    /* Scroll area */
    .dp-body {
      flex: 1; overflow-y: auto; overflow-x: hidden;
    }
    .dp-body::-webkit-scrollbar { width: 4px; }
    .dp-body::-webkit-scrollbar-thumb { background: rgba(201,168,76,.2); border-radius: 2px; }

    /* Tab panes */
    .dp-pane { display: none; padding: .75rem; }
    .dp-pane.active { display: block; }

    /* Ficha expandida */
    .dp-section-title {
      font-size: .62rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--gold); margin: .75rem 0 .4rem;
      display: flex; align-items: center; gap: .4rem;
    }
    .dp-section-title::before {
      content: ''; flex: 1; height: 1px; background: rgba(201,168,76,.15);
    }
    .dp-section-title::after {
      content: ''; flex: 1; height: 1px; background: rgba(201,168,76,.15);
    }

    .dp-ab {
      border-radius: 7px; padding: .55rem .65rem;
      margin-bottom: .4rem;
      border: 1px solid rgba(201,168,76,.12);
      background: rgba(16,19,32,.7);
      border-left: 3px solid rgba(201,168,76,.3);
    }
    .dp-ab.passiva { border-left-color: rgba(110,200,120,.5); }
    .dp-ab.ativa   { border-left-color: rgba(96,165,250,.5); }
    .dp-ab.ultimate { border-left-color: rgba(167,139,250,.6); }
    .dp-ab-name {
      font-family: 'Cinzel', serif; font-size: .86rem; font-weight: 600;
      color: var(--text1); margin-bottom: .25rem;
      display: flex; align-items: center; gap: .4rem;
    }
    .dp-ab-badge {
      font-size: .52rem; font-weight: 700; letter-spacing: .07em;
      padding: .1rem .3rem; border-radius: 3px; text-transform: uppercase;
    }
    .dp-ab-badge.passiva { background: rgba(110,200,120,.15); color: #6dc87a; border: 1px solid rgba(110,200,120,.3); }
    .dp-ab-badge.ativa   { background: rgba(96,165,250,.15);  color: #60a5fa; border: 1px solid rgba(96,165,250,.3); }
    .dp-ab-badge.ultimate { background: rgba(167,139,250,.15); color: #a78bfa; border: 1px solid rgba(167,139,250,.3); }
    .dp-ab-desc {
      font-size: .84rem; color: #c7bcaa; line-height: 1.65;
      user-select: text; -webkit-user-select: text;
    }
    .dp-ab-stats {
      margin-top: .42rem; font-size: .76rem; color: var(--gold);
      line-height: 1.55; user-select: text; -webkit-user-select: text;
    }

    /* Attr grid no painel */
    .dp-attr-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: .4rem;
      margin-bottom: .5rem;
    }
    .dp-attr {
      text-align: center; background: rgba(16,19,32,.7);
      border: 1px solid rgba(201,168,76,.1); border-radius: 6px;
      padding: .35rem .2rem;
    }
    .dp-attr-name { font-size: .58rem; color: var(--text2); letter-spacing: .06em; text-transform: uppercase; }
    .dp-attr-val { font-family: 'Cinzel', serif; font-size: .95rem; color: var(--text1); font-weight: 700; }
    .dp-attr-mod { font-size: .65rem; color: var(--gold); }

    /* ── Aba de Análise IA ── */
    .dp-ai-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: .75rem; padding: 2rem 1rem; text-align: center;
    }
    .dp-ai-spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(201,168,76,.15);
      border-top-color: var(--gold);
      animation: dp-spin .8s linear infinite;
    }
    @keyframes dp-spin { to { transform: rotate(360deg); } }
    .dp-ai-loading-txt { font-size: .78rem; color: var(--text2); }

    .dp-ai-error {
      padding: 1rem; text-align: center;
      color: var(--red); font-size: .8rem;
    }

    /* Combo cards */
    .combo-card {
      border-radius: 8px; padding: .65rem .75rem;
      margin-bottom: .55rem;
      background: rgba(14,16,28,.8);
      border: 1px solid rgba(201,168,76,.12);
      border-left: 3px solid;
      transition: border-color .2s, background .2s;
    }
    .combo-card:hover { background: rgba(20,22,38,.9); }
    .combo-card.basic    { border-left-color: rgba(110,200,120,.5); }
    .combo-card.advanced { border-left-color: rgba(96,165,250,.5); }
    .combo-card.ultimate { border-left-color: rgba(167,139,250,.6); }

    .combo-tier {
      font-size: .55rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; margin-bottom: .3rem;
      display: inline-flex; align-items: center; gap: .3rem;
    }
    .combo-tier.basic    { color: #6dc87a; }
    .combo-tier.advanced { color: #60a5fa; }
    .combo-tier.ultimate { color: #a78bfa; }

    .combo-name {
      font-family: 'Cinzel', serif; font-size: .92rem; font-weight: 600;
      color: var(--text1); margin-bottom: .3rem;
    }
    .combo-desc {
      font-size: .84rem; color: #cbc0ad; line-height: 1.65; margin-bottom: .42rem;
      user-select: text; -webkit-user-select: text;
    }
    .combo-steps {
      display: flex; flex-wrap: wrap; gap: .25rem; margin-bottom: .3rem;
    }
    .combo-step {
      font-size: .6rem; font-weight: 600; padding: .12rem .4rem;
      border-radius: 4px; background: rgba(201,168,76,.1);
      color: var(--gold); border: 1px solid rgba(201,168,76,.2);
    }
    .combo-effect {
      font-size: .79rem; color: #dfc36d; font-style: italic; line-height: 1.55;
      user-select: text; -webkit-user-select: text;
    }
    .combo-copy-row {
      display: flex; justify-content: flex-end; margin-top: .45rem;
    }
    .combo-copy-btn, .quick-copy-btn {
      background: rgba(201,168,76,.08);
      border: 1px solid rgba(201,168,76,.2);
      color: var(--gold);
      border-radius: 6px;
      padding: .22rem .5rem;
      font-size: .68rem;
      font-family: 'Rajdhani',sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: all .16s;
    }
    .combo-copy-btn:hover, .quick-copy-btn:hover {
      background: rgba(201,168,76,.14);
      border-color: rgba(201,168,76,.4);
      color: var(--gold2);
    }
    .quick-card {
      border-radius: 9px;
      padding: .8rem .85rem;
      margin-bottom: .65rem;
      background: linear-gradient(145deg, rgba(18,20,36,.9), rgba(12,14,25,.94));
      border: 1px solid rgba(201,168,76,.14);
      border-left: 3px solid rgba(96,165,250,.55);
    }
    .quick-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: .65rem;
      margin-bottom: .4rem;
    }
    .quick-name {
      font-family: 'Cinzel', serif; font-size: .92rem; font-weight: 600; color: var(--text1);
      line-height: 1.35;
    }
    .quick-roll {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .75rem; font-weight: 700; letter-spacing: .04em;
      color: #8ec5ff;
      background: rgba(96,165,250,.08);
      border: 1px solid rgba(96,165,250,.22);
      border-radius: 999px;
      padding: .16rem .48rem;
      margin-top: .3rem;
      user-select: text; -webkit-user-select: text;
    }
    .quick-desc {
      font-size: .86rem; color: #d0c5b3; line-height: 1.7; margin-bottom: .45rem;
      user-select: text; -webkit-user-select: text;
      white-space: pre-wrap;
    }
    .quick-metrics {
      display: grid; grid-template-columns: 1fr; gap: .35rem; margin-bottom: .5rem;
    }
    .quick-metric {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(201,168,76,.08);
      border-radius: 7px;
      padding: .45rem .55rem;
    }
    .quick-metric-label {
      font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); margin-bottom: .12rem;
    }
    .quick-metric-value {
      font-size: .82rem; color: #ead8a1; line-height: 1.55;
      user-select: text; -webkit-user-select: text;
      white-space: pre-wrap;
    }
    .ai-copy-block {
      background: rgba(8,9,18,.75);
      border: 1px dashed rgba(201,168,76,.2);
      border-radius: 8px;
      padding: .55rem .6rem;
      font-size: .82rem;
      color: #ece2c8;
      line-height: 1.65;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }
    .dp-ai-copyable, .dp-ai-copyable * {
      user-select: text;
      -webkit-user-select: text;
    }
    .dp-header-info, .dp-name, .dp-sub, .dp-stat-val, .dp-stat-lbl,
    .dp-attr, .dp-attr-name, .dp-attr-val, .dp-attr-mod,
    .dp-ab, .dp-ab-name, .dp-ab-badge, .dp-section-title {
      user-select: text;
      -webkit-user-select: text;
    }

    .dp-ai-note {
      font-size: .66rem; color: rgba(100,96,90,.8); text-align: center;
      padding: .5rem; border-top: 1px solid rgba(201,168,76,.08); margin-top: .5rem;
    }
  </style>
</head>
<body>

  <!-- ── Topbar ── -->
  <nav class="topbar">
    <span class="tb-brand">CODEX ARCANUM</span>
    <div class="tb-sep"></div>
    <span class="tb-title">Quadro de Sessão</span>
    <div class="tb-spacer"></div>
    <div id="board-mode-pill" onclick="toggleBoardMode()" style="
      display:flex; align-items:center; gap:.35rem;
      padding:.22rem .65rem; border-radius:12px; cursor:pointer;
      font-family:'Rajdhani',sans-serif; font-size:.7rem; font-weight:700;
      border:1px solid rgba(201,168,76,.25); background:rgba(0,0,0,.2);
      color:#9e8e6a; transition:all .2s; user-select:none;
    "></div>
    <button class="tb-btn primary" onclick="toggleSidebar()">
      <i class="bi bi-plus-lg"></i> Adicionar Ficha
    </button>
    <button class="tb-btn" onclick="resetView()">
      <i class="bi bi-fullscreen"></i> Centralizar
    </button>
    <button class="tb-btn" onclick="clearBoard()">
      <i class="bi bi-trash3"></i> Limpar Quadro
    </button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="window.location.href='fichas.html'">
      <i class="bi bi-collection"></i> Fichas
    </button>
    <button class="tb-btn" onclick="window.location.href='hub.html'">
      <i class="bi bi-arrow-left"></i> Início
    </button>
  </nav>

  <!-- ── Quadro ── -->
  <div id="board">
    <div id="board-canvas"></div>
  </div>

  <!-- ── Sidebar de fichas disponíveis ── -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>Fichas Salvas</span>
      <button class="sidebar-close" onclick="toggleSidebar()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div style="padding:.55rem .6rem 0;">
      <select id="sidebar-folder-filter" class="sidebar-filter" onchange="renderSidebar()">
        <option value="">Todas as pastas</option>
      </select>
    </div>
    <div style="padding:.55rem .6rem .2rem;">
      <div style="position:relative;">
        <i class="bi bi-search" style="position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:#64605a;font-size:.75rem;pointer-events:none;"></i>
        <input id="sidebar-search" type="text" placeholder="Buscar por nome ou perfil..."
               oninput="renderSidebar()"
               style="width:100%;background:rgba(6,7,14,.85);border:1px solid rgba(201,168,76,.18);
                      border-radius:8px;color:#ddd0b8;padding:.38rem .65rem .38rem 2rem;
                      font-size:.76rem;box-sizing:border-box;outline:none;
                      font-family:'Rajdhani',sans-serif;letter-spacing:.03em;"/>
      </div>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </div>

  <!-- ── Zoom indicator ── -->
  <div class="zoom-indicator" id="zoom-ind">100%</div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"><i class="bi bi-check-circle"></i> <span id="toast-msg"></span></div>

  <!-- ── Painel de Detalhe (esquerda) ── -->
  <aside class="detail-panel" id="detail-panel">
    <div class="dp-header">
      <div class="dp-avatar" id="dp-avatar"><i class="bi bi-person-fill"></i></div>
      <div class="dp-header-info">
        <div class="dp-name" id="dp-name">—</div>
        <div class="dp-sub" id="dp-sub">—</div>
      </div>
      <button class="dp-close" onclick="closeDetailPanel()" title="Fechar"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="dp-stats-row">
      <div class="dp-stat"><span class="dp-stat-val hp" id="dp-hp">—</span><div class="dp-stat-lbl">PV</div></div>
      <div class="dp-stat"><span class="dp-stat-val" id="dp-ca">—</span><div class="dp-stat-lbl">CA</div></div>
      <div class="dp-stat"><span class="dp-stat-val" id="dp-dano">—</span><div class="dp-stat-lbl">Dano</div></div>
      <div class="dp-stat"><span class="dp-stat-val" id="dp-ba">—</span><div class="dp-stat-lbl">Ataque</div></div>
      <div class="dp-stat"><span class="dp-stat-val" id="dp-bd">—</span><div class="dp-stat-lbl">Defesa</div></div>
      <div class="dp-stat"><span class="dp-stat-val" id="dp-arm">—</span><div class="dp-stat-lbl">Armadura</div></div>
    </div>
    <div class="dp-tabs">
      <button class="dp-tab active" onclick="switchDpTab('ficha', this)"><i class="bi bi-person-lines-fill"></i> Ficha</button>
      <button class="dp-tab"       onclick="switchDpTab('analise', this)"><i class="bi bi-lightning-charge-fill"></i> Análise IA</button>
    </div>
    <div class="dp-body">
      <div class="dp-pane active" id="dp-pane-ficha"></div>
      <div class="dp-pane" id="dp-pane-analise">
        <div class="dp-ai-loading" id="dp-ai-loading" style="display:none">
          <div class="dp-ai-spinner"></div>
          <div class="dp-ai-loading-txt">Analisando ficha com IA…<br/><span style="font-size:.65rem;opacity:.6">Isso pode levar alguns segundos</span></div>
        </div>
        <div id="dp-ai-error" class="dp-ai-error" style="display:none"></div>
        <div id="dp-ai-content" style="display:none;padding:.6rem .75rem"></div>
        <div id="dp-ai-placeholder" style="padding:1.5rem .75rem;text-align:center;color:var(--text2);font-size:.78rem;">
          <i class="bi bi-lightning-charge" style="font-size:1.5rem;color:var(--gold);display:block;margin-bottom:.5rem;opacity:.5"></i>
          Clique em <strong style="color:var(--gold)">Analisar com IA</strong> para gerar um guia de combate com combos e sugestões táticas.
        </div>
        <div style="padding:.5rem .75rem .75rem;flex-shrink:0;">
          <button id="dp-ai-btn" onclick="runAiAnalysis()" style="width:100%;padding:.52rem;border-radius:7px;background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));border:1px solid rgba(201,168,76,.35);color:var(--gold);font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.05em;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:.4rem;">
            <i class="bi bi-stars"></i> Analisar com IA
          </button>
        </div>
      </div>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/db.js"></script>
  <script>
    let currentUser = null;
    let _allSheets = [];
    let _folders = [];
    let _folderAssignments = {};

    // ════════════════════════════════════════════════════════
    // AUTH GUARD
    // ════════════════════════════════════════════════════════
        async function initAuth() {
      try {
        currentUser = await DB.initAuth();
        if (!currentUser) { window.location.href = '/login.html'; return; }
        await loadBoard();
      } catch(err) {
        console.error('[board initAuth]', err);
        showToast('Erro de conexão com o banco');
      }
    }

    // ════════════════════════════════════════════════════════
    // ESTADO DO QUADRO
    // ════════════════════════════════════════════════════════
    let pan   = { x: 0, y: 0 };
    let zoom  = 1;
    let cards = []; // [{id, sheetId, x, y, hpCurrent}]

    const board  = document.getElementById('board');
    const canvas = document.getElementById('board-canvas');

    // ── Carregar estado salvo ─────────────────────────────
    async function loadBoard() {
      _allSheets = await DB.getSheets();
      try {
        const folderData = await DB.getFolders();
        _folders = folderData.folders || [];
        _folderAssignments = folderData.assignments || {};
      } catch (e) {
        console.error('[board folders]', e);
        _folders = [];
        _folderAssignments = {};
      }
      cards      = await DB.getBoard();
      renderSidebarFolderFilter();
      renderBoard();
    }
    
    let boardSaveTimeout = null;
    async function saveBoard() {
      clearTimeout(boardSaveTimeout);
      boardSaveTimeout = setTimeout(() => DB.saveBoard(cards), 500);
    }

    // ── Fichas do usuário ─────────────────────────────────
    function getSheets() {
      return _allSheets;
    }

    function getFolderNameBySheetId(sheetId) {
      const folderId = _folderAssignments[String(sheetId)];
      if (!folderId) return '';
      return _folders.find(f => String(f.id) === String(folderId))?.name || '';
    }

    function getFolderPath(folderId) {
      const names = [];
      let current = _folders.find(f => String(f.id) === String(folderId));
      while (current) {
        names.unshift(current.name);
        current = current.parentId ? _folders.find(f => String(f.id) === String(current.parentId)) : null;
      }
      return names.join(' / ');
    }

    function getDescendantFolderIds(folderId) {
      const ids = new Set([String(folderId)]);
      const walk = parentId => {
        _folders
          .filter(f => String(f.parentId || '') === String(parentId))
          .forEach(f => {
            ids.add(String(f.id));
            walk(f.id);
          });
      };
      walk(folderId);
      return ids;
    }

    function renderSidebarFolderFilter() {
      const select = document.getElementById('sidebar-folder-filter');
      if (!select) return;
      const current = select.value;
      const options = ['<option value="">Todas as pastas</option>', '<option value="__no_folder__">Sem pasta</option>'];
      const renderTree = (parentId = null, depth = 0) => {
        _folders
          .filter(f => String(f.parentId || '') === String(parentId || ''))
          .forEach(f => {
            const prefix = depth ? `${'&nbsp;'.repeat(depth * 2)}&#8627; ` : '';
            options.push(`<option value="${f.id}">${prefix}${getFolderPath(f.id)}</option>`);
            renderTree(f.id, depth + 1);
          });
      };
      renderTree();
      select.innerHTML = options.join('');
      select.value = current;
    }
    const PROFILE_NAMES = { guerreiro: 'Guerreiro', especialista: 'Especialista', mistico: 'Místico' };

    // ════════════════════════════════════════════════════════
    // PAN & ZOOM
    // ════════════════════════════════════════════════════════
    function applyTransform() {
      canvas.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
    }

    let isPanning = false, panStart = { x: 0, y: 0 };

    board.addEventListener('mousedown', e => {
      if (e.target !== board && e.target !== canvas) return;
      isPanning = true;
      panStart = { x: e.clientX - pan.x, y: e.clientY - pan.y };
      board.classList.add('panning');
    });
    window.addEventListener('mousemove', e => {
      if (!isPanning) return;
      pan = { x: e.clientX - panStart.x, y: e.clientY - panStart.y };
      applyTransform();
    });
    window.addEventListener('mouseup', () => {
      isPanning = false; board.classList.remove('panning');
    });

    board.addEventListener('wheel', e => {
      e.preventDefault();
      const rect   = board.getBoundingClientRect();
      const mx     = e.clientX - rect.left;
      const my     = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      const newZ   = Math.min(3, Math.max(0.2, zoom * factor));
      pan.x = mx - (mx - pan.x) * (newZ / zoom);
      pan.y = my - (my - pan.y) * (newZ / zoom);
      zoom  = newZ;
      applyTransform();
      showZoom();
    }, { passive: false });

    // Touch pan
    let touches = null;
    board.addEventListener('touchstart', e => {
      if (e.touches.length === 1 && (e.target === board || e.target === canvas)) {
        touches = e.touches[0];
        panStart = { x: e.touches[0].clientX - pan.x, y: e.touches[0].clientY - pan.y };
      }
    }, { passive: true });
    board.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && touches) {
        pan = { x: e.touches[0].clientX - panStart.x, y: e.touches[0].clientY - panStart.y };
        applyTransform();
      }
    }, { passive: true });

    function resetView() {
      pan = { x: 80, y: 80 }; zoom = 1; applyTransform();
    }

    let zoomTimer;
    function showZoom() {
      const ind = document.getElementById('zoom-ind');
      ind.textContent = `${Math.round(zoom * 100)}%`;
      ind.classList.add('visible');
      clearTimeout(zoomTimer);
      zoomTimer = setTimeout(() => ind.classList.remove('visible'), 1200);
    }

    // ════════════════════════════════════════════════════════
    // RENDERIZAÇÃO DOS CARDS NO QUADRO
    // ════════════════════════════════════════════════════════
    function renderBoard() {
      canvas.innerHTML = '';
      cards.forEach(c => {
        const sheet = getSheets().find(s => s.id === c.sheetId);
        if (!sheet) return;
        canvas.appendChild(createBoardCard(c, sheet));
      });
    }

    function createBoardCard(cardState, sheet) {
      const el = document.createElement('div');
      el.className = 'board-card';
      el.dataset.cardId = cardState.id;
      el.style.left = cardState.x + 'px';
      el.style.top  = cardState.y + 'px';

      const data  = sheet.data || {};
      const stats = data.stats || {};
      const maxHp = stats.vida || 0;
      const curHp = cardState.hpCurrent ?? maxHp;
      const hpPct = maxHp > 0 ? Math.max(0, Math.min(100, (curHp / maxHp) * 100)) : 100;
      const hpColor = hpPct > 60 ? '#6dcc80' : hpPct > 30 ? '#e8c96a' : '#e05252';

      const abilities = data.abilities || [];
      const avatarHtml = sheet.avatar
        ? `<img src="${sheet.avatar}" alt="avatar"/>`
        : `<i class="bi bi-person-fill"></i>`;

      el.innerHTML = `
        <!-- Header arrastável -->
        <div class="bc-header" data-drag="true">
          <div class="bc-avatar">${avatarHtml}</div>
          <div class="bc-info">
            <div class="bc-name" title="${sheet.nome}">${sheet.nome}</div>
            <div class="bc-tags">
              <span class="bc-tag">Nv ${sheet.nivel}</span>
              <span class="bc-tag">NA ${sheet.na}</span>
              <span class="bc-tag profile">${PROFILE_NAMES[sheet.profile] || sheet.profile}</span>
            </div>
          </div>
          <button class="bc-open" onclick="openDetailPanel('${cardState.id}'); event.stopPropagation();" title="Abrir painel">
            <i class="bi bi-layout-sidebar-inset"></i>
          </button>
          <button class="bc-close" onclick="removeCardFromBoard('${cardState.id}')" title="Remover do quadro">
            <i class="bi bi-x"></i>
          </button>
        </div>

        <!-- PV com barra -->
        <div class="bc-hp-wrap">
          <div class="bc-hp-row">
            <span class="bc-hp-label"><i class="bi bi-heart-fill me-1"></i>Pontos de Vida</span>
            <span>
              <span class="bc-hp-val" contenteditable="true"
                    data-field="hp" data-card="${cardState.id}" data-max="${maxHp}"
                    title="Clique para editar">${curHp}</span>
              <span class="bc-hp-max"> / ${maxHp}</span>
            </span>
          </div>
          <div class="bc-hp-bar">
            <div class="bc-hp-fill" id="hp-bar-${cardState.id}"
                 style="width:${hpPct}%; background:${hpColor}"></div>
          </div>
        </div>

        <!-- Stats CA / Arm / BA / BD / Reações -->
        <div class="bc-stats">
          <div class="bc-stat">
            <div class="bc-stat-val">${stats.ca ?? '—'}</div>
            <div class="bc-stat-lbl">CA</div>
          </div>
          <div class="bc-stat">
            <div class="bc-stat-val">+${stats.ba ?? '—'}</div>
            <div class="bc-stat-lbl">Ataque</div>
          </div>
          <div class="bc-stat">
            <div class="bc-stat-val">+${stats.bd ?? '—'}</div>
            <div class="bc-stat-lbl">Defesa</div>
          </div>
          <div class="bc-stat">
            <div class="bc-stat-val">${stats.arm ?? '—'}</div>
            <div class="bc-stat-lbl">Armadura</div>
          </div>
          <div class="bc-stat">
            <div class="bc-stat-val">${stats.reac ?? '—'}</div>
            <div class="bc-stat-lbl">Reações</div>
          </div>
          <div class="bc-stat">
            <div class="bc-stat-val" style="font-size:.75rem">${stats.dano || '—'}</div>
            <div class="bc-stat-lbl">Dano</div>
          </div>
        </div>

        <!-- Habilidades colapsáveis -->
        ${abilities.length ? `
        <div class="bc-section-toggle" onclick="toggleAbilities(this)">
          <span><i class="bi bi-stars me-1"></i>Habilidades (${abilities.length})</span>
          <i class="bi bi-chevron-down"></i>
        </div>
        <div class="bc-abilities">
          ${abilities.map(ab => `
            <div class="bc-ab ${ab.type || ''}">
              <div class="bc-ab-name">${ab.name}</div>
              <div class="bc-ab-desc" style="font-size:.68rem;line-height:1.4;margin-top:.1rem;user-select:text;-webkit-user-select:text;cursor:text">${ab.description || ''}</div>
              ${ab.stats?.length ? `<div class="bc-ab-stats" style="margin-top:.25rem;font-size:.65rem;color:#c9a84c;user-select:text;-webkit-user-select:text;cursor:text">${ab.stats.join(' · ')}</div>` : ''}
            </div>
          `).join('')}
        </div>` : ''}

        <!-- Quick actions -->
        <div class="bc-actions">
          <button class="bc-act" id="btn-dmg-${cardState.id}"
                  onclick="toggleHpPanel('${cardState.id}','dmg')">
            <i class="bi bi-dash-circle"></i> Dano
          </button>
          <button class="bc-act" id="btn-heal-${cardState.id}"
                  onclick="toggleHpPanel('${cardState.id}','heal')">
            <i class="bi bi-plus-circle"></i> Cura
          </button>
          <button class="bc-act" onclick="copyStats('${cardState.id}')">
            <i class="bi bi-clipboard"></i> Copiar
          </button>
          <button class="bc-act red" onclick="resetHp('${cardState.id}')">
            <i class="bi bi-arrow-counterclockwise"></i> Reset
          </button>
        </div>
        <!-- Inline HP panel -->
        <div class="bc-hp-panel" id="hp-panel-${cardState.id}">
          <div class="bc-hp-panel-inner">
            <span class="bc-hp-panel-label" id="hp-panel-lbl-${cardState.id}">DANO</span>
            <input class="bc-hp-input" type="number" min="0" id="hp-panel-inp-${cardState.id}"
                   placeholder="0"
                   onkeydown="if(event.key==='Enter') applyHpPanel('${cardState.id}')"
                   onclick="event.stopPropagation()"/>
            <button class="bc-hp-apply" onclick="applyHpPanel('${cardState.id}')">Aplicar</button>
            <button class="bc-hp-cancel" onclick="closeHpPanel('${cardState.id}')"><i class="bi bi-x"></i></button>
          </div>
        </div>
      `;

      // ── Drag do card ──
      makeDraggable(el, cardState);

      // ── Clique esquerdo no card → abre painel de detalhe ──
      // (apenas se não foi um drag — verificado no mouseup)
      let _clickStartX, _clickStartY;
      el.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        _clickStartX = e.clientX; _clickStartY = e.clientY;
      });
      el.addEventListener('click', e => {
        const dx = Math.abs(e.clientX - _clickStartX);
        const dy = Math.abs(e.clientY - _clickStartY);
        // Só abre painel se foi clique sem arrastar (< 5px)
        // e não clicou em botão, input ou contenteditable
        if (dx < 5 && dy < 5) {
          const isInteractive = e.target.closest('button, input, [contenteditable="true"], .bc-section-toggle');
          if (!isInteractive) openDetailPanel(cardState.id);
        }
      });

      // ── Editar HP inline ──
      el.querySelectorAll('[data-field="hp"]').forEach(input => {
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        });
        input.addEventListener('blur', () => {
          const val = parseInt(input.textContent) || 0;
          const max = parseInt(input.dataset.max) || 1;
          updateHp(cardState.id, val, max);
        });
        // Previne arrastar o card ao clicar no HP
        input.addEventListener('mousedown', e => e.stopPropagation());
      });

      return el;
    }

    function toggleAbilities(toggle) {
      const panel = toggle.nextElementSibling;
      const icon  = toggle.querySelector('.bi-chevron-down, .bi-chevron-up');
      panel.classList.toggle('open');
      if (icon) icon.className = panel.classList.contains('open') ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
    }

    // ════════════════════════════════════════════════════════
    // DRAG DOS CARDS
    // ════════════════════════════════════════════════════════
    function makeDraggable(el, cardState) {
      const handle = el.querySelector('[data-drag="true"]');
      let dragging = false, startX, startY, startLeft, startTop;

      handle.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        dragging = true; e.stopPropagation();
        startX = e.clientX; startY = e.clientY;
        startLeft = parseInt(el.style.left) || 0;
        startTop  = parseInt(el.style.top)  || 0;
        el.style.zIndex = 1000;
        el.style.boxShadow = '0 16px 48px rgba(0,0,0,.8), 0 0 0 1px rgba(201,168,76,.4)';
      });

      window.addEventListener('mousemove', e => {
        if (!dragging) return;
        const dx = (e.clientX - startX) / zoom;
        const dy = (e.clientY - startY) / zoom;
        el.style.left = (startLeft + dx) + 'px';
        el.style.top  = (startTop  + dy) + 'px';
      });

      window.addEventListener('mouseup', e => {
        if (!dragging) return;
        dragging = false;
        el.style.zIndex = '';
        el.style.boxShadow = '';
        cardState.x = parseInt(el.style.left);
        cardState.y = parseInt(el.style.top);
        saveBoard();
      });
    }

    // ════════════════════════════════════════════════════════
    // AÇÕES DOS CARDS
    // ════════════════════════════════════════════════════════
    function getCard(id) { return cards.find(c => c.id === id); }

    function updateHp(cardId, newHp, max) {
      const c = getCard(cardId);
      if (!c) return;
      c.hpCurrent = Math.max(0, Math.min(newHp, max));
      saveBoard();

      // Atualiza visualmente sem re-render completo
      const bar  = document.getElementById(`hp-bar-${cardId}`);
      const pct  = max > 0 ? (c.hpCurrent / max) * 100 : 0;
      const col  = pct > 60 ? '#6dcc80' : pct > 30 ? '#e8c96a' : '#e05252';
      if (bar) { bar.style.width = pct + '%'; bar.style.backgroundColor = col; }
      const valEl = document.querySelector(`[data-field="hp"][data-card="${cardId}"]`);
      if (valEl) valEl.textContent = c.hpCurrent;
    }

    // ── Inline HP panel (substitui prompt) ──────────────────
    let _activePanelCard = null;
    let _activePanelMode = null;

    function toggleHpPanel(cardId, mode) {
      // Se já está aberto no mesmo card e modo, fecha
      if (_activePanelCard === cardId && _activePanelMode === mode) {
        closeHpPanel(cardId);
        return;
      }
      // Fecha qualquer painel aberto
      if (_activePanelCard) closeHpPanel(_activePanelCard);

      const panel = document.getElementById('hp-panel-' + cardId);
      const lbl   = document.getElementById('hp-panel-lbl-' + cardId);
      const inp   = document.getElementById('hp-panel-inp-' + cardId);
      const btnD  = document.getElementById('btn-dmg-'  + cardId);
      const btnH  = document.getElementById('btn-heal-' + cardId);
      if (!panel || !inp) return;

      _activePanelCard = cardId;
      _activePanelMode = mode;

      panel.className = 'bc-hp-panel open ' + (mode === 'dmg' ? 'dmg-mode' : 'heal-mode');
      lbl.textContent  = mode === 'dmg' ? 'DANO' : 'CURA';
      inp.value = '';

      if (btnD) btnD.classList.toggle('active',    mode === 'dmg');
      if (btnD) btnD.classList.toggle('dmg',       mode === 'dmg');
      if (btnH) btnH.classList.toggle('active',    mode === 'heal');

      // Foca o input com pequeno delay (rendering)
      setTimeout(() => inp.focus(), 50);
    }

    function closeHpPanel(cardId) {
      const panel = document.getElementById('hp-panel-' + cardId);
      const btnD  = document.getElementById('btn-dmg-'  + cardId);
      const btnH  = document.getElementById('btn-heal-' + cardId);
      if (panel) { panel.classList.remove('open'); }
      if (btnD)  { btnD.classList.remove('active','dmg'); }
      if (btnH)  { btnH.classList.remove('active'); }
      if (_activePanelCard === cardId) {
        _activePanelCard = null;
        _activePanelMode = null;
      }
    }

    function applyHpPanel(cardId) {
      const inp  = document.getElementById('hp-panel-inp-' + cardId);
      if (!inp) return;
      const val = parseInt(inp.value);
      if (isNaN(val) || val < 0) { inp.focus(); return; }

      const c = getCard(cardId);
      if (!c) return;
      const sheet = getSheets().find(s => String(s.id) === String(c.sheetId));
      const max   = sheet?.data?.stats?.vida || c.hpCurrent;

      if (_activePanelMode === 'dmg') {
        updateHp(cardId, (c.hpCurrent ?? max) - val, max);
        showToast(`-${val} PV`);
      } else {
        updateHp(cardId, (c.hpCurrent ?? max) + val, max);
        showToast(`+${val} PV`);
      }
      closeHpPanel(cardId);
    }

    function resetHp(cardId) {
      const c = getCard(cardId);
      if (!c) return;
      const sheet = getSheets().find(s => s.id === c.sheetId);
      const max   = sheet?.data?.stats?.vida || 0;
      updateHp(cardId, max, max);
      showToast('PV restaurado');
    }

    function copyStats(cardId) {
      const c = getCard(cardId);
      if (!c) return;
      const sheet = getSheets().find(s => s.id === c.sheetId);
      if (!sheet) return;
      const s = sheet.data?.stats || {};
      const text = [
        `📋 ${sheet.nome} (Nv ${sheet.nivel} · NA ${sheet.na})`,
        `❤️ PV: ${c.hpCurrent ?? s.vida} / ${s.vida}`,
        `🛡️ CA: ${s.ca}  |  Arm: ${s.arm}`,
        `⚔️ Ataque: d20+${s.ba}  |  Defesa: d20+${s.bd}`,
        `🎲 Dano: ${s.dano}${s.danoExtra || ''}`,
        `⚡ Reações: ${s.reac}`,
      ].join('\n');
      navigator.clipboard.writeText(text).then(() => showToast('Stats copiados!')).catch(() => {});
    }

    function removeCardFromBoard(cardId) {
      cards = cards.filter(c => c.id !== cardId);
      saveBoard();
      renderBoard();
    }

    function clearBoard() {
      if (!confirm('Remover todas as fichas do quadro?')) return;
      cards = []; saveBoard(); renderBoard();
    }

    // ════════════════════════════════════════════════════════
    // SIDEBAR — adicionar fichas ao quadro
    // ════════════════════════════════════════════════════════
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('open');
      if (sb.classList.contains('open')) {
        renderSidebar();
        setTimeout(() => document.getElementById('sidebar-search')?.focus(), 80);
      } else {
        const inp = document.getElementById('sidebar-search');
        if (inp) inp.value = '';
      }
    }

    function renderSidebar() {
      const list = document.getElementById('sidebar-list');
      const q    = (document.getElementById('sidebar-search')?.value || '').toLowerCase().trim();
      let sheets = getSheets();

      if (q) {
        sheets = sheets.filter(s => {
          const nome   = (s.nome    || '').toLowerCase();
          const perfil = (s.profile || '').toLowerCase();
          const perfilPt = perfil === 'mistico' ? 'místico' : perfil;
          return nome.includes(q) || perfil.includes(q) || perfilPt.includes(q);
        });
      }

      if (!sheets.length) {
        list.innerHTML = q
          ? `<div class="sl-empty">Nenhuma ficha encontrada<br/>para "<b>${q}</b>".</div>`
          : '<div class="sl-empty">Nenhuma ficha salva.<br/>Crie fichas primeiro.</div>';
        return;
      }
      list.innerHTML = sheets.map(s => {
        const avatarHtml = s.avatar
          ? `<img src="${s.avatar}" alt="av"/>`
          : `<i class="bi bi-person-fill"></i>`;
        return `
          <div class="sl-item" onclick="addToBoard('${s.id}')">
            <div class="sl-avatar">${avatarHtml}</div>
            <div class="sl-info">
              <div class="sl-name" title="${s.nome}">${s.nome}</div>
              <div class="sl-meta">Nv ${s.nivel} · ${PROFILE_NAMES[s.profile] || s.profile}</div>
            </div>
          </div>`;
      }).join('');
    }

    function addToBoard(sheetId) {
      // Calcula posição central do viewport atual
      const bRect = board.getBoundingClientRect();
      const cx = (bRect.width  / 2 - pan.x) / zoom - 130;
      const cy = (bRect.height / 2 - pan.y) / zoom - 100;

      // Offset para não sobrepor cards existentes
      const offset = cards.length * 30;

      const sheet = getSheets().find(s => s.id === sheetId);
      const newCard = {
        id:        Date.now().toString(),
        sheetId,
        x:         cx + offset,
        y:         cy + offset,
        hpCurrent: sheet?.data?.stats?.vida ?? 0
      };
      cards.push(newCard);
      saveBoard();
      renderBoard();
      showToast(`${sheet?.nome || 'Ficha'} adicionada ao quadro`);
    }

    // ════════════════════════════════════════════════════════
    // PAINEL DE DETALHE (clique esquerdo no card do quadro)
    // ════════════════════════════════════════════════════════

    let _detailCardId  = null;   // card atualmente no painel
    let _aiCache       = {};     // cache da análise por sheetId
    let _aiRunning     = false;

    const ATTR_NAMES_PANEL = ['FOR','DES','CON','INT','SAB','CAR'];

    function attrModPanel(v) {
      const m = Math.floor((parseInt(v) - 10) / 2);
      return (m >= 0 ? '+' : '') + m;
    }

    // Abre o painel com os dados do card clicado
    function openDetailPanel(cardId) {
      const c = getCard(cardId);
      if (!c) return;
      const sheet = getSheets().find(s => String(s.id) === String(c.sheetId));
      if (!sheet) return;

      _detailCardId = cardId;
      const data  = sheet.data || {};
      const stats = data.stats  || {};
      const curHp = c.hpCurrent ?? stats.vida ?? '—';

      // Header
      const avatarEl = document.getElementById('dp-avatar');
      avatarEl.innerHTML = sheet.avatar
        ? `<img src="${sheet.avatar}" alt="av"/>`
        : `<i class="bi bi-person-fill"></i>`;

      document.getElementById('dp-name').textContent = sheet.nome || '—';

      const raca    = data.raca ? ` · ${data.raca}` : '';
      const profile = (typeof PROFILE_NAMES !== 'undefined' ? PROFILE_NAMES[sheet.profile] : null) || sheet.profile || '—';
      document.getElementById('dp-sub').textContent =
        `Nv ${sheet.nivel} · NA ${sheet.na} · ${profile}${raca}`;

      // Stats rápidos
      document.getElementById('dp-hp'  ).textContent = `${curHp}/${stats.vida ?? '—'}`;
      document.getElementById('dp-ca'  ).textContent = stats.ca   ?? '—';
      document.getElementById('dp-dano').textContent = (stats.dano ?? '—') + (stats.danoExtra || '');
      document.getElementById('dp-ba'  ).textContent = `+${stats.ba ?? '—'}`;
      document.getElementById('dp-bd'  ).textContent = `+${stats.bd ?? '—'}`;
      document.getElementById('dp-arm' ).textContent = stats.arm  ?? '—';

      // Renderiza aba Ficha
      renderDpFicha(sheet, c);

      // Resetar aba análise se for nova ficha
      if (!_aiCache[c.sheetId]) {
        resetAiPane();
      } else {
        renderAiContent(_aiCache[c.sheetId]);
      }

      // Volta pra aba Ficha ao abrir
      switchDpTab('ficha', document.querySelector('.dp-tab'));

      document.getElementById('detail-panel').classList.add('open');
    }

    function closeDetailPanel() {
      document.getElementById('detail-panel').classList.remove('open');
      _detailCardId = null;
    }

    function switchDpTab(tab, btn) {
      document.querySelectorAll('.dp-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.dp-pane').forEach(p => p.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const pane = document.getElementById('dp-pane-' + tab);
      if (pane) pane.classList.add('active');
    }

    // Renderiza a ficha completa na aba Ficha
    function renderDpFicha(sheet, cardState) {
      const data  = sheet.data  || {};
      const stats = data.stats  || {};
      const abs   = data.abilities || [];
      const attrs = data.attrs  || [];

      // Atributos
      const attrHtml = attrs.length
        ? `<div class="dp-section-title">Atributos</div>
           <div class="dp-attr-grid">
             ${ATTR_NAMES_PANEL.map((n, i) => `
               <div class="dp-attr">
                 <div class="dp-attr-name">${n}</div>
                 <div class="dp-attr-val">${attrs[i] ?? '—'}</div>
                 <div class="dp-attr-mod">${attrs[i] != null ? attrModPanel(attrs[i]) : ''}</div>
               </div>`).join('')}
           </div>` : '';

      // Habilidades
      const typeLabel = { passiva: 'Passiva', ativa: 'Ativa', ultimate: 'Ultimate' };
      const abHtml = abs.map(ab => `
        <div class="dp-ab ${ab.type || ''}">
          <div class="dp-ab-name">
            <span class="dp-ab-badge ${ab.type || ''}">${typeLabel[ab.type] || ab.type}</span>
            ${ab.name}
          </div>
          <div class="dp-ab-desc">${ab.description || ''}</div>
          ${ab.stats && ab.stats.length
            ? `<div class="dp-ab-stats">${ab.stats.join(' · ')}</div>` : ''}
        </div>`).join('');

      const raceBlock = data.raca
        ? `<div class="dp-section-title">Raça</div>
           <div style="font-size:.78rem;color:var(--text1);padding:.3rem .1rem .5rem;font-family:'Cinzel',serif">${data.raca}</div>`
        : '';

      document.getElementById('dp-pane-ficha').innerHTML =
        `<div style="padding:.6rem .75rem">
          ${raceBlock}
          ${attrHtml}
          <div class="dp-section-title">Habilidades</div>
          ${abHtml || '<div style="font-size:.75rem;color:var(--text2);padding:.5rem 0">Sem habilidades registradas.</div>'}
        </div>`;
    }

    // Reseta a aba de análise ao estado inicial (sem cache)
    function resetAiPane() {
      document.getElementById('dp-ai-loading'    ).style.display = 'none';
      document.getElementById('dp-ai-error'      ).style.display = 'none';
      document.getElementById('dp-ai-content'    ).style.display = 'none';
      document.getElementById('dp-ai-placeholder').style.display = 'block';
      const btn = document.getElementById('dp-ai-btn');
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-stars"></i> Analisar com IA'; }
    }

    // ── Chamada IA de análise ────────────────────────────────
    async function runAiAnalysis() {
      if (_aiRunning) return;
      const c = _detailCardId ? getCard(_detailCardId) : null;
      if (!c) return;
      const sheet = getSheets().find(s => String(s.id) === String(c.sheetId));
      if (!sheet) return;

      // Usa cache se já analisou
      if (_aiCache[c.sheetId]) {
        renderAiContent(_aiCache[c.sheetId]);
        return;
      }

      _aiRunning = true;
      const btn = document.getElementById('dp-ai-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Analisando…'; }

      document.getElementById('dp-ai-placeholder').style.display = 'none';
      document.getElementById('dp-ai-error'      ).style.display = 'none';
      document.getElementById('dp-ai-content'    ).style.display = 'none';
      document.getElementById('dp-ai-loading'    ).style.display = 'flex';

      try {
        const result = await callAiAnalysis(sheet);
        _aiCache[c.sheetId] = result;
        renderAiContent(result);
      } catch (err) {
        document.getElementById('dp-ai-loading').style.display = 'none';
        document.getElementById('dp-ai-error'  ).style.display = 'block';
        document.getElementById('dp-ai-error'  ).innerHTML =
          `<i class="bi bi-exclamation-triangle"></i> ${err.message || 'Erro ao analisar. Tente novamente.'}`;
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> Tentar novamente'; }
      } finally {
        _aiRunning = false;
      }
    }

    // Constrói o prompt e chama a IA via proxy
    async function callAiAnalysis(sheet) {
      const data   = sheet.data  || {};
      const stats  = data.stats  || {};
      const abs    = data.abilities || [];
      const attrs  = data.attrs  || [];
      const profile = (typeof PROFILE_NAMES !== 'undefined' ? PROFILE_NAMES[sheet.profile] : null) || sheet.profile;
      const raca   = data.raca ? `Raça: ${data.raca}` : '';

      const abList = abs.map((ab, i) =>
        `${i+1}. [${(ab.type||'').toUpperCase()}] ${ab.name}: ${ab.description}${ab.stats?.length ? ' | ' + ab.stats.join(', ') : ''}`
      ).join('\n');

      const attrStr = ATTR_NAMES_PANEL.map((n, i) => `${n}:${attrs[i]??'?'}`).join(' ');

      const systemPrompt = `Você é um analista tático de RPG. Sua função é analisar fichas de personagem e retornar APENAS um JSON válido, sem texto antes ou depois, sem blocos de código markdown.`;

      const userPrompt = `Analise este personagem e gere um guia de combate compacto com combos táticos.

PERSONAGEM: ${sheet.nome}
Perfil: ${profile} | Nível: ${sheet.nivel} | NA: ${sheet.na}
${raca}
Stats: PV:${stats.vida} CA:${stats.ca} Arm:${stats.arm} Ataque:+${stats.ba} Defesa:+${stats.bd} Dano:${stats.dano}${stats.danoExtra||''} Reações:${stats.reac}
Atributos: ${attrStr}

HABILIDADES:
${abList}

Gere combos e sugestões táticas, do mais simples ao mais avançado.
Cada combo deve ter um nome criativo, descrever quais habilidades usar e em que ordem, o efeito esperado e os dados relevantes.

Retorne SOMENTE este JSON:
{
  "combos": [
    {
      "tier": "basico",
      "nome": "Nome do Combo",
      "descricao": "Como executar este combo de forma resumida.",
      "passos": ["Habilidade A", "Habilidade B"],
      "efeito": "Efeito esperado com dados/valores relevantes.",
      "dica": "Dica tática de quando usar."
    }
  ],
  "resumo_tatico": "Parágrafo curto (2-3 frases) sobre o estilo de jogo ideal deste personagem.",
  "ponto_forte": "Principal força em combate.",
  "ponto_fraco": "Principal fraqueza ou limitação."
}

Gere entre 4 e 6 combos: 2 básicos, 2 avançados, 1-2 ultimate.
Tiers possíveis: "basico", "avancado", "ultimate".`;

      const messages = [
        { role: 'system', content: systemPrompt },
        { role: 'user',   content: userPrompt }
      ];

      const response = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API retornou ${response.status}: ${errText.slice(0, 120)}`);
      }

      const apiData = await response.json();
      const rawText = apiData?.choices?.[0]?.message?.content || '';
      if (!rawText) throw new Error('IA retornou resposta vazia.');

      const cleanText = rawText.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
      let parsed;
      try {
        parsed = JSON.parse(cleanText);
      } catch {
        const match = cleanText.match(/\{[\s\S]*\}/);
        if (match) parsed = JSON.parse(match[0]);
        else throw new Error('IA não retornou JSON válido.');
      }
      if (!parsed.combos || !Array.isArray(parsed.combos)) throw new Error('Resposta inválida da IA.');
      return parsed;
    }

    // Renderiza o conteúdo da análise no painel
    function renderAiContent(data) {
      document.getElementById('dp-ai-loading'    ).style.display = 'none';

    function showToast(msg) {

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function copyTextBlock(text, successMsg = 'Texto copiado!') {

    async function callAiJson(messages) {
      const response = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API retornou ${response.status}: ${errText.slice(0, 160)}`);
      }

      const apiData = await response.json();
      const rawText = apiData?.choices?.[0]?.message?.content || '';
      if (!rawText) throw new Error('IA retornou resposta vazia.');
      return rawText;
    }

    function getBestJsonCandidate(rawText) {
      const cleanText = String(rawText || '')
        .replace(/```json\s*/gi, '')
        .replace(/```\s*/g, '')
        .trim();

      const fencedObject = cleanText.match(/\{[\s\S]*\}/);
      return (fencedObject ? fencedObject[0] : cleanText).trim();
    }

    function tryParseJsonVariants(text) {
      const attempts = [];
      const base = getBestJsonCandidate(text);
      attempts.push(base);
      attempts.push(base.replace(/,\s*([}\]])/g, '$1'));
      attempts.push(base.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'"));
      attempts.push(
        base
          .replace(/[\u201C\u201D]/g, '"')
          .replace(/[\u2018\u2019]/g, "'")
          .replace(/,\s*([}\]])/g, '$1')
      );

      let lastError = null;
      for (const candidate of attempts) {
        try {
          return JSON.parse(candidate);
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('Falha ao interpretar JSON.');
    }

    async function repairJsonWithAi(rawText, shapeHint) {
      const repairPrompt = `Converta o texto abaixo em JSON valido.
Retorne APENAS JSON valido.
Nao adicione explicacoes.
Preserve o maximo possivel do conteudo original.
Garanta esta estrutura minima: ${shapeHint}

TEXTO:
${rawText}`;

      const repairedRaw = await callAiJson([
        {
          role: 'system',
          content: 'Voce e um reparador de JSON. Retorne apenas JSON valido.'
        },
        {
          role: 'user',
          content: repairPrompt
        }
      ]);

      return tryParseJsonVariants(repairedRaw);
    }

    async function parseAiJsonResponse(rawText, requiredKeys, shapeHint) {
      try {
        const parsed = tryParseJsonVariants(rawText);
        const ok = requiredKeys.every(key =>
          Object.prototype.hasOwnProperty.call(parsed, key)
        );
        if (ok) return parsed;
      } catch (err) {
        console.warn('[parseAiJsonResponse:first-pass]', err);
      }

      const repaired = await repairJsonWithAi(getBestJsonCandidate(rawText), shapeHint);
      const ok = requiredKeys.every(key =>
        Object.prototype.hasOwnProperty.call(repaired, key)
      );
      if (!ok) throw new Error('IA retornou estrutura invalida mesmo apos reparo.');
      return repaired;
    }

    function getFolderNameBySheetId(sheetId) {
      const folderId = _folderAssignments[String(sheetId)];
      if (!folderId) return '';
      return _folders.find(f => String(f.id) === String(folderId))?.name || '';
    }

    function getFolderPath(folderId) {
      const names = [];
      let current = _folders.find(f => String(f.id) === String(folderId));
      while (current) {
        names.unshift(current.name);
        current = current.parentId ? _folders.find(f => String(f.id) === String(current.parentId)) : null;
      }
      return names.join(' / ');
    }

    function getDescendantFolderIds(folderId) {
      const ids = new Set([String(folderId)]);
      const walk = parentId => {
        _folders
          .filter(f => String(f.parentId || '') === String(parentId))
          .forEach(f => {
            ids.add(String(f.id));
            walk(f.id);
          });
      };
      walk(folderId);
      return ids;
    }

      const select = document.getElementById('sidebar-folder-filter');
      if (!select) return;
      const current = select.value;
      const options = [
        '<option value="">Todas as pastas</option>',
        '<option value="__no_folder__">Sem pasta</option>'
      ];
      const renderTree = (parentId = null, depth = 0) => {
        _folders
          .filter(f => String(f.parentId || '') === String(parentId || ''))
          .forEach(f => {
            const prefix = depth ? `${' '.repeat(depth * 2)}-> ` : '';
            options.push(`<option value="${f.id}">${prefix}${getFolderPath(f.id)}</option>`);
            renderTree(f.id, depth + 1);
          });
      };
      renderTree();
      select.innerHTML = options.join('');
      select.value = current;
