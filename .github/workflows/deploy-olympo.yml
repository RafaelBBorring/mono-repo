name: Deploy Portfolio + Projects to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/portfolio/**'
      - 'apps/System-Olympo/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/System-Olympo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/System-Olympo

      - name: Build System-Olympo
        run: npm run build
        working-directory: apps/System-Olympo
        env:
          VITE_BASE: /mono-repo/system-olympo/

      - name: Assemble site
        run: |
          mkdir -p _site/system-olympo
          cp -r apps/System-Olympo/dist/* _site/system-olympo/
          cp apps/System-Olympo/dist/index.html _site/system-olympo/404.html
          cp -r apps/portfolio/* _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
