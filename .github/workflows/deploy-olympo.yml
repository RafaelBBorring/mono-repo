name: Deploy Portfolio + Projects to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/portfolio/**'
      - 'apps/System-Olympo/**'
      - 'apps/Morpheus-System/**'
      - 'apps/Athena-Project/**'
      - 'apps/Cypher-Project/**'
      - 'apps/Hades-VFX/**'
      - 'apps/codex-arcanum/**'
      - 'apps/Poseidon/**'
      - '.github/workflows/deploy-olympo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── System-Olympo (React + Vite) ──
      - name: Cache System-Olympo deps
        uses: actions/cache@v4
        with:
          path: apps/System-Olympo/node_modules
          key: olympo-${{ hashFiles('apps/System-Olympo/package-lock.json') }}

      - name: Build System-Olympo
        run: |
          npm ci
          npm run build
        working-directory: apps/System-Olympo
        env:
          VITE_BASE: /mono-repo/system-olympo/

      # ── Hades-VFX (Vite) ──
      - name: Cache Hades-VFX deps
        uses: actions/cache@v4
        with:
          path: apps/Hades-VFX/node_modules
          key: hades-${{ hashFiles('apps/Hades-VFX/package-lock.json') }}

      - name: Build Hades-VFX
        run: |
          npm ci
          npm run build
        working-directory: apps/Hades-VFX
        env:
          VITE_BASE: /mono-repo/hades-vfx/

      # Morpheus-System (Next static export for GitHub Pages)
      # Stripe checkout on Pages must use public Payment Links or a separate backend.
      - name: Cache Morpheus deps
        uses: actions/cache@v4
        with:
          path: apps/Morpheus-System/node_modules
          key: morpheus-${{ hashFiles('apps/Morpheus-System/package-lock.json') }}

      - name: Build Morpheus static
        run: |
          npm ci
          mv src/app/api src/static-build-api-routes
          npm run build
        working-directory: apps/Morpheus-System
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: /mono-repo/morpheus
          NEXT_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/mono-repo/morpheus
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.MORPHEUS_SUPABASE_URL || vars.MORPHEUS_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MORPHEUS_SUPABASE_ANON_KEY || vars.MORPHEUS_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BILLING_REQUIRED: ${{ vars.MORPHEUS_BILLING_REQUIRED || 'true' }}
          NEXT_PUBLIC_STRIPE_CHECKOUT_ENABLED: ${{ vars.MORPHEUS_STRIPE_CHECKOUT_ENABLED || 'false' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.MORPHEUS_API_BASE_URL }}
          NEXT_PUBLIC_SERVER_API_AVAILABLE: ${{ vars.MORPHEUS_SERVER_API_AVAILABLE || 'false' }}
          NEXT_PUBLIC_STRIPE_LINK_ESSENTIAL_MONTHLY: ${{ vars.MORPHEUS_STRIPE_LINK_ESSENTIAL_MONTHLY }}
          NEXT_PUBLIC_STRIPE_LINK_ESSENTIAL_ANUAL: ${{ vars.MORPHEUS_STRIPE_LINK_ESSENTIAL_ANUAL }}
          NEXT_PUBLIC_STRIPE_LINK_PRO_MONTHLY: ${{ vars.MORPHEUS_STRIPE_LINK_PRO_MONTHLY }}
          NEXT_PUBLIC_STRIPE_LINK_PRO_ANUAL: ${{ vars.MORPHEUS_STRIPE_LINK_PRO_ANUAL }}
          NEXT_PUBLIC_STRIPE_LINK_ELITE_MONTHLY: ${{ vars.MORPHEUS_STRIPE_LINK_ELITE_MONTHLY }}
          NEXT_PUBLIC_STRIPE_LINK_ELITE_ANUAL: ${{ vars.MORPHEUS_STRIPE_LINK_ELITE_ANUAL }}
          NEXT_PUBLIC_STRIPE_LINK_TRIAL: ${{ vars.MORPHEUS_STRIPE_LINK_TRIAL }}

      # ── Poseidon (React + Vite) ──
      - name: Cache Poseidon deps
        uses: actions/cache@v4
        with:
          path: apps/Poseidon/frontend/node_modules
          key: poseidon-${{ hashFiles('apps/Poseidon/frontend/package-lock.json') }}

      - name: Build Poseidon
        run: |
          npm ci
          npm run build
        working-directory: apps/Poseidon/frontend

      # ── Assemble site ──
      - name: Assemble site
        run: |
          mkdir -p _site

          # Portfolio → root
          cp -r apps/portfolio/* _site/

          # System-Olympo → /system-olympo/
          mkdir -p _site/system-olympo
          cp -r apps/System-Olympo/dist/* _site/system-olympo/
          cp apps/System-Olympo/dist/index.html _site/system-olympo/404.html

          # Athena-Project → /athena/
          mkdir -p _site/athena
          cp -r apps/Athena-Project/index.html _site/athena/
          cp -r apps/Athena-Project/src _site/athena/
          cp -r apps/Athena-Project/models _site/athena/

          # Cypher-Project → /cypher/
          mkdir -p _site/cypher
          cp -r apps/Cypher-Project/index.html _site/cypher/
          cp -r apps/Cypher-Project/games _site/cypher/

          # Hades-VFX → /hades-vfx/
          mkdir -p _site/hades-vfx
          cp -r apps/Hades-VFX/dist/* _site/hades-vfx/

          # Morpheus-System -> /morpheus/ (static test build)
          mkdir -p _site/morpheus
          cp -r apps/Morpheus-System/out/* _site/morpheus/
          cp apps/Morpheus-System/out/index.html _site/morpheus/404.html

          # Codex Arcanum → /codex-arcanum/ (static version)
          mkdir -p _site/codex-arcanum
          cp apps/codex-arcanum/static-patch.js _site/codex-arcanum/
          cp -r apps/codex-arcanum/js _site/codex-arcanum/
          cp -r apps/codex-arcanum/css _site/codex-arcanum/
          cp apps/codex-arcanum/index.html _site/codex-arcanum/
          cp apps/codex-arcanum/login.html _site/codex-arcanum/
          cp apps/codex-arcanum/hub.html _site/codex-arcanum/
          cp apps/codex-arcanum/fichas.html _site/codex-arcanum/
          cp apps/codex-arcanum/board.html _site/codex-arcanum/
          cp apps/codex-arcanum/npc-guide.html _site/codex-arcanum/

          # Inject static-patch.js into all Codex HTML files
          cd _site/codex-arcanum
          for f in *.html; do
            sed -i 's|</head>|<script src="static-patch.js"></script></head>|' "$f"
            sed -i "s|window.location.href = '/login.html'|window.location.href = 'login.html'|g" "$f"
            sed -i "s|window.location.href = '/hub.html'|window.location.href = 'hub.html'|g" "$f"
          done
          # Also patch the JS files for navigation
          sed -i "s|window.location.href = '/login.html'|window.location.href = 'login.html'|g" js/db.js js/main.js js/supabase.js
          cd ../..

          # Poseidon → /poseidon/
          mkdir -p _site/poseidon
          cp -r apps/Poseidon/frontend/dist/* _site/poseidon/
          cp apps/Poseidon/frontend/dist/index.html _site/poseidon/404.html

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
