name: Deploy System-Olympo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/System-Olympo/**'
      - '.github/workflows/deploy-olympo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/System-Olympo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/System-Olympo

      - name: Build
        run: npm run build
        working-directory: apps/System-Olympo

      - name: Add 404.html for SPA routing
        run: cp apps/System-Olympo/dist/index.html apps/System-Olympo/dist/404.html

      - name: Add .nojekyll
        run: touch apps/System-Olympo/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/System-Olympo/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
