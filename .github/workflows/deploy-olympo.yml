name: Deploy Portfolio + Projects to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/portfolio/**'
      - 'apps/System-Olympo/**'
      - 'apps/Athena-Project/**'
      - 'apps/Cypher-Project/**'
      - 'apps/Hades-VFX/**'
      - 'apps/Morpheus-System/**'
      - 'apps/codex-arcanum/**'
      - '.github/workflows/deploy-olympo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── System-Olympo (React + Vite) ──
      - name: Cache System-Olympo deps
        uses: actions/cache@v4
        with:
          path: apps/System-Olympo/node_modules
          key: olympo-${{ hashFiles('apps/System-Olympo/package-lock.json') }}

      - name: Build System-Olympo
        run: |
          npm ci
          npm run build
        working-directory: apps/System-Olympo
        env:
          VITE_BASE: /mono-repo/system-olympo/

      # ── Hades-VFX (Vite) ──
      - name: Cache Hades-VFX deps
        uses: actions/cache@v4
        with:
          path: apps/Hades-VFX/node_modules
          key: hades-${{ hashFiles('apps/Hades-VFX/package-lock.json') }}

      - name: Build Hades-VFX
        run: |
          npm ci
          npm run build
        working-directory: apps/Hades-VFX
        env:
          VITE_BASE: /mono-repo/hades-vfx/

      # ── Morpheus-System (Next.js static export) ──
      - name: Cache Morpheus-System deps
        uses: actions/cache@v4
        with:
          path: apps/Morpheus-System/node_modules
          key: morpheus-sys-${{ hashFiles('apps/Morpheus-System/package-lock.json') }}

      - name: Build Morpheus-System
        run: |
          npm ci
          npm run build
        working-directory: apps/Morpheus-System

      # ── Assemble site ──
      - name: Assemble site
        run: |
          mkdir -p _site

          # Portfolio → root
          cp -r apps/portfolio/* _site/

          # System-Olympo → /system-olympo/
          mkdir -p _site/system-olympo
          cp -r apps/System-Olympo/dist/* _site/system-olympo/
          cp apps/System-Olympo/dist/index.html _site/system-olympo/404.html

          # Athena-Project → /athena/
          mkdir -p _site/athena
          cp -r apps/Athena-Project/index.html _site/athena/
          cp -r apps/Athena-Project/src _site/athena/
          cp -r apps/Athena-Project/models _site/athena/

          # Cypher-Project → /cypher/
          mkdir -p _site/cypher
          cp -r apps/Cypher-Project/index.html _site/cypher/
          cp -r apps/Cypher-Project/games _site/cypher/

          # Hades-VFX → /hades-vfx/
          mkdir -p _site/hades-vfx
          cp -r apps/Hades-VFX/dist/* _site/hades-vfx/

          # Morpheus-System → /morpheus-system/
          mkdir -p _site/morpheus-system
          cp -r apps/Morpheus-System/out/* _site/morpheus-system/

          # Codex Arcanum → /codex-arcanum/ (static version)
          mkdir -p _site/codex-arcanum
          cp apps/codex-arcanum/static-patch.js _site/codex-arcanum/
          cp -r apps/codex-arcanum/js _site/codex-arcanum/
          cp -r apps/codex-arcanum/css _site/codex-arcanum/
          cp apps/codex-arcanum/index.html _site/codex-arcanum/
          cp apps/codex-arcanum/login.html _site/codex-arcanum/
          cp apps/codex-arcanum/hub.html _site/codex-arcanum/
          cp apps/codex-arcanum/fichas.html _site/codex-arcanum/
          cp apps/codex-arcanum/board.html _site/codex-arcanum/
          cp apps/codex-arcanum/npc-guide.html _site/codex-arcanum/

          # Inject static-patch.js into all Codex HTML files
          cd _site/codex-arcanum
          for f in *.html; do
            sed -i 's|</head>|<script src="static-patch.js"></script></head>|' "$f"
            sed -i "s|window.location.href = '/login.html'|window.location.href = 'login.html'|g" "$f"
            sed -i "s|window.location.href = '/hub.html'|window.location.href = 'hub.html'|g" "$f"
          done
          # Also patch the JS files for navigation
          sed -i "s|window.location.href = '/login.html'|window.location.href = 'login.html'|g" js/db.js js/main.js js/supabase.js
          cd ../..

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
